<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141820"/>
      <stop offset="100%" stop-color="#080A0D"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="32" height="32" rx="7.5" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="7" stroke="rgba(255,255,255,0.15)" stroke-width="1" fill="none"/>

  <!-- P Stem -->
  <path d="M 9.5 7.5 L 9.5 24.5" 
        stroke="#FFFFFF" 
        stroke-width="3" 
        stroke-linecap="round"/>

  <!-- P Loop -->
  <path d="M 9.5 7.5 L 15.5 7.5 C 19 7.5 21.5 9.2 21.5 12 C 21.5 14.8 19 16.5 15.5 16.5 L 9.5 16.5" 
        stroke="#FFFFFF" 
        stroke-width="3" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none"/>

  <!-- Live Status Node (Emerald Green Pulse) -->
  <circle cx="21" cy="22.5" r="4" fill="#5FD39B" opacity="0.3"/>
  <circle cx="21" cy="22.5" r="2.4" fill="#5FD39B" filter="url(#glow)"/>
</svg>
