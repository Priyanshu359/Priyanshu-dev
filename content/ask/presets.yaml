presets:
  - id: "work"
    question: "What does Priyanshu work on?"
    answer: "Priyanshu is a backend engineer at StudyIQ. He is responsible for maintaining and operating 20+ Java/Spring Boot microservices within a 35+ services infrastructure and works on caching, Kafka pipelines and production reliability for high-traffic exam platforms."
  - id: "traffic"
    question: "How does he handle traffic spikes?"
    answer: "Redis caching on read-heavy paths, Kafka for async work, connection-pool tuning and Kubernetes autoscaling. You can try the same patterns live in the Lab."
  - id: "ai"
    question: "Has he built AI systems?"
    answer: "Yes: a speech-to-text, LLM and text-to-speech pipeline for automating support calls, plus AI meeting insights. He designs them backend-first, with gateways, streaming, caching and fallbacks."

