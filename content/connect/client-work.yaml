title: "Why clients can trust me with their project"
reasons:
  - id: "production-experience"
    title: "Production experience, not just side projects"
    description: "At StudyIQ I run 20+ services through peaks of 100K+ requests a minute. Your project gets the same engineering habits."
  - id: "milestones"
    title: "See it before you pay for it"
    description: "Work is split into milestones. You review each one on a live staging link, then pay for it."
  - id: "fixed-quote"
    title: "Fixed quote, written scope"
    description: "A short agreement before we start: what’s included, the timeline and the price. No surprise invoices."
  - id: "ownership"
    title: "You own everything"
    description: "Full source code, repository and IP transfer to you on final payment, with a documented handover."
  - id: "confidentiality"
    title: "Confidential by default"
    description: "Happy to sign your NDA. Your idea and your data stay yours."
  - id: "testable-proof"
    title: "Proof you can test today"
    description: "The Lab on this site runs on my own backend. Try it before you ever message me."
