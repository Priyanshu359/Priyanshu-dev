codeSection:
  title: "Cache-Aside Implementation"
  filename: "CacheLabService.java"
  code: |
    public CacheItemResult getOrCompute(String key) {
        String redisKey = "lab:cache:" + key;
        
        // 1. Check Redis memory cache
        String cached = redisTemplate.opsForValue().get(redisKey);
        if (cached != null) {
            long ttl = redisTemplate.getExpire(redisKey);
            return new CacheItemResult(key, parse(cached), true, 1L, ttl, "Redis");
        }
        
        // 2. Cache Miss: Query database (~75ms)
        Map<String, Object> data = databaseRepository.findById(key);
        
        // 3. Populate Redis with atomic TTL (30s)
        redisTemplate.opsForValue().set(redisKey, toJson(data), Duration.ofSeconds(30));
        
        return new CacheItemResult(key, data, false, 75L, 30L, "PostgreSQL");
    }
  githubLinkText: "Full source on GitHub →"
