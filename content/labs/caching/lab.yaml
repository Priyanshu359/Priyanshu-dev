tradeOffsHeading: "Trade-offs I weighed"
tradeOffs:
  - title: "Cache-Aside vs Read-Through"
    text: "Cache-aside keeps application logic in control of fallback behavior, retry logic, and fallback serialization if Redis is temporarily unreachable."
  - title: "TTL vs Active Invalidation"
    text: "A 30s TTL guarantees data eventually becomes consistent even if an invalidation message is dropped during network partitions."
  - title: "Thundering Herd / Cache Stampede"
    text: "When high-frequency keys expire, hundreds of concurrent threads can hit the DB simultaneously. Mutex locking or probabilistic early recomputation (XFetch) protects hot keys."
