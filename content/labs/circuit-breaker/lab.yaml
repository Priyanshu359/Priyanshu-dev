kicker: "Lab / 06 · Circuit breaker"
headline: "Break a downstream service and watch it fail fast, then recover."
intro: "When an external microservice slows to a crawl, uncapped timeouts exhaust your application's thread pool and bring down the whole system. A circuit breaker fails fast in <1ms, returns fallback data, and tests recovery via half-open probes."
liveBadge: "LIVE · Resilience4j State Machine · 60% Threshold"
