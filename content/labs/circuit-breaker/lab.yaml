  capacity: 5
  refillRateMs: 1000
  refillTokens: 0
diagram:
  title: "Circuit Breaker State Machine"
  subtitle: "CLOSED (normal traffic) → trips to OPEN when failures exceed 60% → transitions to HALF-OPEN after 5s wait duration to probe recovery."
  alertNote: "OPEN State: Fails fast in <1ms without blocking Tomcat threads | CLOSED: Normal 200 OK"
  nodes:
    - id: "client"
      label: "Client Request"
      sub: "API Traffic"
