codeSection:
  title: "Resilience4j Circuit Breaker Config"
  filename: "CircuitBreakerConfig.java"
  code: |
    @Bean
    public CircuitBreaker customCircuitBreaker(CircuitBreakerRegistry registry) {
        CircuitBreakerConfig config = CircuitBreakerConfig.custom()
            .slidingWindowSize(5)
            .failureRateThreshold(60.0f)
            .waitDurationInOpenState(Duration.ofSeconds(5))
            .permittedNumberOfCallsInHalfOpenState(2)
            .automaticTransitionFromOpenToHalfOpenEnabled(true)
            .build();
            
        return registry.circuitBreaker("downstreamService", config);
    }
  githubLinkText: "Full source on GitHub →"
  githubUrl: "https://github.com/Priyanshu359/Priyanshu-dev"
tradeOffsHeading: "Trade-offs I weighed"
tradeOffs:
  - title: "Time-based vs Count-based Sliding Window"
    text: "Count-based windows (e.g. last 10 calls) react predictably under burst traffic, while time-based windows (e.g. last 30s) are ideal for services with low, steady call volumes."
  - title: "Fallback Data vs Clean Fast-Fail Error"
    text: "Returning cached, degraded data (e.g., product recommendations without personalized rankings) keeps users engaged, while critical payment operations must fail fast with clean 503s."
  - title: "Thread Pool Isolation (Bulkhead) + Circuit Breakers"
    text: "Pairing a circuit breaker with a dedicated bulkhead thread pool ensures that even in the brief window before a breaker trips, a slow downstream cannot consume all container threads."
