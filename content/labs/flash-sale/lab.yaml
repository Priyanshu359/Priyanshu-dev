codeSection:
  title: "Atomic Stock Decrement in Lua"
  filename: "flash_sale.lua"
  code: |
    -- flash_sale.lua (executed atomically inside Redis single-thread engine)
    local current = tonumber(redis.call('GET', KEYS[1]) or 0)
    local requested = tonumber(ARGV[1])
    
    if current >= requested then
        redis.call('DECRBY', KEYS[1], requested)
        return {1, current - requested}  -- Success: allowed, remaining stock
    else
        return {0, current}              -- Failed: out of stock, zero oversold
    end
  githubLinkText: "Full source on GitHub →"
  githubUrl: "https://github.com/Priyanshu359/Priyanshu-dev"
tradeOffsHeading: "Trade-offs I weighed"
tradeOffs:
  - title: "Redis Atomic Decrement vs Database SELECT FOR UPDATE"
    text: "Pessimistic DB row locking saturates PostgreSQL connection pools at >1,000 req/s. Redis Lua handles 50,000+ atomic operations per second in memory, keeping DB write-behind queues manageable."
  - title: "Distributed Lock (Redlock) vs Atomic Decrement"
    text: "Acquiring a full distributed lock for inventory involves multiple network round-trips. An atomic DECRBY or Lua script achieves the same mutual exclusion in a single round-trip."
  - title: "Inventory Reservation vs Immediate Charge"
    text: "Reserving stock with a 5-minute TTL allows buyers to complete checkout while freeing up unpurchased stock automatically if payment is abandoned."
