codeSection:
  title: "Idempotency Key Handler"
  filename: "PaymentLabService.java"
  code: |
    public PaymentChargeResult processPayment(PaymentChargeRequest req) {
        String redisKey = "idempotency:" + req.idempotencyKey();
        
        // 1. Check if key was already processed
        String cached = redisTemplate.opsForValue().get(redisKey);
        if (cached != null) {
            PaymentChargeResult prev = parse(cached);
            return prev.withReplayed(true); // Return cached response, 0 double-charge
        }
        
        // 2. Fresh transaction: charge external payment gateway
        PaymentChargeResult result = stripeClient.charge(req.amountCents());
        
        // 3. Store result with 5-minute TTL
        redisTemplate.opsForValue().set(redisKey, toJson(result), Duration.ofMinutes(5));
        return result;
    }
  githubLinkText: "Full source on GitHub →"
  githubUrl: "https://github.com/Priyanshu359/Priyanshu-dev"
tradeOffsHeading: "Trade-offs I weighed"
tradeOffs:
  - title: "In-Flight Locking (SETNX PENDING) vs Post-Processing Cache"
    text: "If two requests with the same key arrive simultaneously, setting a PENDING lock prevents both threads from charging the card while the first is still awaiting the bank gateway."
  - title: "Payload Fingerprinting vs Key Only"
    text: "Hashing the request body alongside the key guarantees a client cannot reuse an old idempotency key with different parameters (e.g., changing amount from $10 to $1,000)."
  - title: "Key Retention Window"
    text: "A 24-hour TTL in production covers virtually all network retries, webhook re-deliveries, and accidental user double-submits without growing Redis memory unboundedly."
