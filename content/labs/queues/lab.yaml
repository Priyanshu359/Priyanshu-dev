tradeOffsHeading: "Trade-offs I weighed"
tradeOffs:
  - title: "In-Memory Retries vs Dedicated Retry Topics"
    text: "Retrying in memory with Thread.sleep blocks the Kafka consumer partition, preventing other messages from advancing. Publishing failed records to dedicated retry topics maintains pipeline throughput."
  - title: "At-Least-Once Delivery vs At-Most-Once"
    text: "At-least-once with idempotent consumer processing ensures zero data loss during broker rebalances or node failures, whereas at-most-once drops messages whenever consumers restart."
  - title: "Manual DLQ Redrive vs Automatic Reprocessing"
    text: "Poison pills caused by schema drift or bugs require code fixes before redriving. Manual, audited replay tools ensure fixed messages do not fail a second time."
