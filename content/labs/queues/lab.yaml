codeSection:
  title: "Spring Kafka / Consumer DLQ Handler"
  filename: "QueueConsumerConfig.java"
  code: |
    @Bean
    public DefaultErrorHandler errorHandler(KafkaTemplate<String, Object> template) {
        // Exponential backoff: 1s initial, 2.0x multiplier, max 3 attempts
        ExponentialBackOff backOff = new ExponentialBackOff(1000L, 2.0);
        backOff.setMaxAttempts(3);
        
        DeadLetterPublishingRecoverer recoverer = new DeadLetterPublishingRecoverer(template,
            (record, ex) -> new TopicPartition("tasks.dlq", record.partition())
        );
        
        return new DefaultErrorHandler(recoverer, backOff);
    }
  githubLinkText: "Full source on GitHub →"
