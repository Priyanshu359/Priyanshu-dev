codeSection:
  title: "The core of it"
  filename: "token_bucket.lua"
  code: |
    -- token_bucket.lua (runs atomically inside Redis)
    local tokens = tonumber(redis.call('HGET', KEYS[1], 'tokens') or ARGV[1])
    local last   = tonumber(redis.call('HGET', KEYS[1], 'ts') or ARGV[3])
    local refill = math.floor((ARGV[3] - last) / ARGV[2])
    tokens = math.min(ARGV[1], tokens + refill)
    if tokens < 1 then return {0, tokens} end
    redis.call('HSET', KEYS[1], 'tokens', tokens - 1, 'ts', ARGV[3])
    return {1, tokens - 1}
  githubLinkText: "Full source on GitHub →"
  githubUrl: "https://github.com/Priyanshu359/Priyanshu-dev"
tradeOffsHeading: "Trade-offs I weighed"
tradeOffs:
  - title: "Token bucket"
    text: "Allows short bursts, smooth over time. Good default for user-facing APIs."
  - title: "Sliding window"
    text: "Stricter and fairer at window edges, but costs more memory per user."
  - title: "Why Lua in Redis"
    text: "Read-check-write in one atomic step, so two servers can’t both spend the last token."
