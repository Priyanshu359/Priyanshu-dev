heading: "Questions clients usually ask"
items:
  - id: "cost"
    question: "How much does a project cost?"
    answer: "Every project gets a fixed quote once I understand what you need, so you know the full price before any work starts. You pay per milestone, after you’ve seen each one working."
  - id: "timeline"
    question: "How long will it take?"
    answer: "Typical timelines are listed with each service above. Before we start, you get a written plan with milestones and dates."
  - id: "non-technical"
    question: "I’m not technical. Is that okay?"
    answer: "Completely. Explain the problem in your own words. I’ll suggest the simplest solution and explain the trade-offs without jargon."
  - id: "ownership"
    question: "Who owns the code?"
    answer: "You do. The full source code, repository and intellectual property transfer to you on final payment."
  - id: "after-launch"
    question: "What happens after launch?"
    answer: "Every project includes [30 days] of free bug fixes. After that, ongoing support or new features can be a small monthly plan or a new fixed quote."
  - id: "international"
    question: "Do you work with clients outside India?"
    answer: "Yes. I work from India (IST), overlap with UK and European working hours and US mornings for calls, and invoice in USD, EUR or GBP through PayPal, Wise or bank transfer."
  - id: "communication"
    question: "How will we communicate?"
    answer: "Over your preferred channel — WhatsApp, Slack or email — with a weekly demo on a live staging link and a short written update."
  - id: "nda"
    question: "Will you sign an NDA?"
    answer: "Yes, happily, before we discuss any details."
