heading: "How a project works"
steps:
  - number: "01"
    title: "Send your request"
    description: "Tell me what you want to build through the contact form. I’ll reply with questions or a first estimate."
  - number: "02"
    title: "Fixed quote & plan"
    description: "A short written scope: what’s included, milestones, timeline and price."
  - number: "03"
    title: "Build, demo, pay"
    description: "Each milestone is shown on a live staging link. You pay for it once you’ve seen it working."
  - number: "04"
    title: "Launch & handover"
    description: "Deployed, documented and yours, with [30 days] of free bug fixes after launch."
