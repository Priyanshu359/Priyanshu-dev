heading: "What I can do for your business"
subline: "Tell me the problem in plain words. I’ll suggest the simplest thing that solves it."
items:
  - number: "01"
    title: "Launch your web or mobile app"
    description: "From idea to a live product: a React web app or Flutter mobile app, with the backend, database and admin panel behind it."
    goodFor: "startups, new products, internal tools"
    timeline: "[6–10 weeks]"
    tech: "React · Flutter · Spring Boot / Node"
  - number: "02"
    title: "Automate with AI"
    description: "AI agents on WhatsApp or your website that answer customer questions, qualify leads and book appointments into your calendar."
    goodFor: "clinics, studios, service businesses"
    timeline: "[2–4 weeks]"
    tech: "AI agents · WhatsApp · Google Calendar"
  - number: "03"
    title: "Build reliable backends & APIs"
    description: "APIs, payments, notifications and integrations with the tools you already use, built to keep working as you grow."
    goodFor: "apps that need a solid backend"
    timeline: "[3–6 weeks]"
    tech: "Spring Boot · Node · Postgres · Redis"
  - number: "04"
    title: "Fix a slow or crashing system"
    description: "A performance audit first, then fixes: caching, database queries, queues and scaling, with before-and-after numbers."
    goodFor: "products that slow down under load"
    timeline: "[1–2 weeks]"
    tech: "profiling · caching · query tuning"
