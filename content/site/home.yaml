demoIntro:
  kicker: "Backend + AI, live"
  title: "Ask me anything. Then watch your question travel through my backend."
  subtitle: "Every AI answer is a backend problem: rate limits, caches, retrieval, streaming. Send a question and see each hop. Then ask the same one again."

demoConfig:
  liveBadge: "LIVE · POST /api/ask"
  note: "Try it: send a question, then send the same one again — the cache answers it without touching the model. Spam it and the rate limiter steps in. Stages are slowed down so you can see them; the labels show real timings. Switch to real speed to see how fast it actually is."
  rateLimitBlockedText: "Whoa, slow down. Retry-After: 3s. (That was the rate limiter protecting the model from you.)"

