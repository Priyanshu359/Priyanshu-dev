services:
  caddy:
    image: caddy:2-alpine
    container_name: caddy-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-priyanshusinha.dev}
      ACME_EMAIL: ${ACME_EMAIL:-priyanshu.kr.sinha74@gmail.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app-network

  api:
    image: ${API_IMAGE:-ghcr.io/priyanshu-sinha/priyanshu-api:latest}
    container_name: priyanshu-api
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      FLYWAY_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: "https://${DOMAIN:-priyanshusinha.dev},https://www.${DOMAIN:-priyanshusinha.dev}"
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      NOTIFICATION_LOG_ONLY: ${NOTIFICATION_LOG_ONLY:-true}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 35s
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    container_name: priyanshu-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  redis_data:
